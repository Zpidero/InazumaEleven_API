name: Update player data

# Re-scrape once a month (or on demand) and commit the refreshed CSVs.
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run update
        run: uv run python update.py

      - name: Test the API against the new data
        run: uv run pytest -q

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/players.csv data/teams.csv
          git diff --staged --quiet || git commit -m "Auto update player data"
          git push
