[project]
name = "inazumaelevenvr-api"
version = "0.1.0"
description = "REST API for Inazuma Eleven: Victory Road players and teams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.133.1",
    "pandas>=3.0.1",
    "requests>=2.32.5",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
